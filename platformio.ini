[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
lib_deps = 
	m5stack/M5Unified@^0.2.10
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2
	tzapu/WiFiManager@^2.0.17
	C:\Users\HackP\OneDrive\Documentos\TCC_GLR_v12\src\ei_v12
lib_extra_dirs = lib
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_port = COM3
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-O3
	-DNDEBUG
	-DEI_CLASSIFIER_ENABLE_ANOMALY=1
	-DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1
	-DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
	-DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
	-DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
